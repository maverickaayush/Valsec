services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valsec
      POSTGRES_USER: valsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valsec_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valsec -d valsec"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://valsec:${POSTGRES_PASSWORD:-valsec_local_change_me}@postgres:5432/valsec
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      VALSEC_ENV: ${VALSEC_ENV:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: sh -c "cd /app && alembic upgrade head && cd /app/backend && uvicorn main:app --host 0.0.0.0 --port 8000"
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_started}
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql://valsec:${POSTGRES_PASSWORD:-valsec_local_change_me}@postgres:5432/valsec
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      VALSEC_ENV: ${VALSEC_ENV:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker --loglevel=info -c 5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
volumes:
  postgres_data:
  redis_data:
