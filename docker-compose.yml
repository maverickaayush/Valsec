services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valsec
      POSTGRES_USER: valsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valsec_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valsec -d valsec"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://valsec:${POSTGRES_PASSWORD:-valsec_local_change_me}@postgres:5432/valsec
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ENABLE_CREDENTIAL_VAULT: ${ENABLE_CREDENTIAL_VAULT:-false}
      CREDENTIAL_VAULT_KEY: ${CREDENTIAL_VAULT_KEY:-}
      SCHEDULE_POLL_SECONDS: ${SCHEDULE_POLL_SECONDS:-60}
      SCHEDULE_FAILURE_THRESHOLD: ${SCHEDULE_FAILURE_THRESHOLD:-3}
      SCHEDULE_MAX_RETRIES: ${SCHEDULE_MAX_RETRIES:-3}
      SCHEDULE_RETRY_BACKOFF_SECONDS: ${SCHEDULE_RETRY_BACKOFF_SECONDS:-60}
      AUTHORIZED_NETWORKS: ${AUTHORIZED_NETWORKS:-}
      MISSION_MAX_CONCURRENT_OPERATIONS: ${MISSION_MAX_CONCURRENT_OPERATIONS:-5}
      REMEDIATION_MAX_CONCURRENT_OPERATIONS: ${REMEDIATION_MAX_CONCURRENT_OPERATIONS:-3}
      MISSION_AUDIT_POLL_SECONDS: ${MISSION_AUDIT_POLL_SECONDS:-5}
      MISSION_AUDIT_POLL_LIMIT: ${MISSION_AUDIT_POLL_LIMIT:-120}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      VALSEC_ENV: ${VALSEC_ENV:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: sh -c "cd /app && alembic upgrade head && cd /app/backend && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql://valsec:${POSTGRES_PASSWORD:-valsec_local_change_me}@postgres:5432/valsec
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ENABLE_CREDENTIAL_VAULT: ${ENABLE_CREDENTIAL_VAULT:-false}
      CREDENTIAL_VAULT_KEY: ${CREDENTIAL_VAULT_KEY:-}
      SCHEDULE_POLL_SECONDS: ${SCHEDULE_POLL_SECONDS:-60}
      SCHEDULE_FAILURE_THRESHOLD: ${SCHEDULE_FAILURE_THRESHOLD:-3}
      SCHEDULE_MAX_RETRIES: ${SCHEDULE_MAX_RETRIES:-3}
      SCHEDULE_RETRY_BACKOFF_SECONDS: ${SCHEDULE_RETRY_BACKOFF_SECONDS:-60}
      AUTHORIZED_NETWORKS: ${AUTHORIZED_NETWORKS:-}
      MISSION_MAX_CONCURRENT_OPERATIONS: ${MISSION_MAX_CONCURRENT_OPERATIONS:-5}
      REMEDIATION_MAX_CONCURRENT_OPERATIONS: ${REMEDIATION_MAX_CONCURRENT_OPERATIONS:-3}
      MISSION_AUDIT_POLL_SECONDS: ${MISSION_AUDIT_POLL_SECONDS:-5}
      MISSION_AUDIT_POLL_LIMIT: ${MISSION_AUDIT_POLL_LIMIT:-120}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      VALSEC_ENV: ${VALSEC_ENV:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker --loglevel=info -Q celery,scheduled_audits,network_missions,remediation -B
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  postgres_data:
  redis_data:
