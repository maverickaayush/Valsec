version 17.9.4
hostname valsec-hardened
ip domain-name secure.example
service password-encryption
enable secret 9 $9$DEMO_HASH_NOT_A_REAL_SECRET
no service finger
no service tcp-small-servers
no service udp-small-servers
no ip bootp server
no ip http server
no ip source-route
banner motd ^CAuthorized operators only.^C
banner login ^CAuthorized operators only.^C
line console 0
 exec-timeout 10 0
 transport preferred ssh
!
line vty 0 15
 exec-timeout 5 30
 transport input ssh
 access-class MGMT-ONLY in
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
logging buffered 64000 informational
service timestamps log datetime msec
ntp server 192.0.2.10 prefer
ntp authenticate
snmp-server group VALSEC v3 priv
no snmp-server community public
no snmp-server community private
aaa new-model
aaa authentication login default group radius local
no cdp run
