#config-version=FGT60F-7.4.3-FW-build2573-240201:opmode=0:vdom=0:user=admin
config system global
    set hostname "fortigate-vulnerable"
    set admintimeout 30
    set admin-ssh-v1 enable
    set strong-crypto disable
end
config system interface
    edit "port1"
        set ip 192.0.2.2 255.255.255.0
        set allowaccess ping http telnet
        set status up
    next
end
config system admin
    edit "admin"
        set password PLAINTEXT_DEMO_VALUE
    next
end
config log disk setting
    set status disable
end
config firewall policy
    edit 1
        set name "unlogged-outbound"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
        set logtraffic disable
        set status enable
    next
end
