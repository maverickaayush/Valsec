version 22.4R1.10;
system {
    host-name juniper-edge-01;
    root-authentication {
        encrypted-password "$6$rounds=656000$example$hash";
    }
    login {
        message "Authorized access only.";
        idle-timeout 10;
    }
    services {
        ssh {
            protocol-version v2;
            client-alive-interval 60;
            max-authentication-retries 3;
        }
        web-management {
            https;
        }
    }
    authentication-order radius;
    syslog {
        file messages {
            any info;
            archive size 1m;
        }
    }
    ntp {
        server 192.0.2.10;
        authentication-key 1 type sha256 value "$9$example";
        trusted-key 1;
    }
}
snmp {
    v3 {
        usm local-engine;
    }
}
protocols {
    lldp {
        interface all disable;
    }
}
