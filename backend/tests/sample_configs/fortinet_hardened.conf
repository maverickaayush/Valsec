#config-version=FGT60F-7.4.3-FW-build2573-240201:opmode=0:vdom=0:user=admin
config system global
    set hostname "fortigate-edge-01"
    set admintimeout 10
    set admin-ssh-v1 disable
    set strong-crypto enable
end
config system interface
    edit "port1"
        set alias "Secure management"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set status up
    next
end
config system admin
    edit "admin"
        set password ENC REDACTED_ENCRYPTED_VALUE
    next
end
config log disk setting
    set status enable
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "192.0.2.10"
        next
    end
end
config system snmp user
    edit "valsec-monitor"
        set security-level auth-priv
    next
end
config firewall policy
    edit 1
        set name "outbound-web"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "trusted-clients"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
        set logtraffic all
        set status enable
    next
end
