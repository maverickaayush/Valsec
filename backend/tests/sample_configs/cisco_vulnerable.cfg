version 15.2
hostname valsec-vulnerable
ip domain-name branch.example
no service password-encryption
enable secret 7 02050D480809
banner motd ^CInternal system.^C
line console 0
 exec-timeout 30 0
!
line vty 0 15
 exec-timeout 15 0
 transport input telnet ssh
!
ip ssh version 1
ip ssh time-out 120
ip ssh authentication-retries 5
logging buffered 16000 informational
no service timestamps log
snmp-server community public RO
no aaa new-model
